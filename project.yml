name: MenuShot
options:
  bundleIdPrefix: com.cgbin
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    COMBINE_HIDPI_IMAGES: YES

targets:
  MenuShot:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: MenuShotFinder
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cgbin.menushot
        PRODUCT_NAME: MenuShot
        INFOPLIST_FILE: Support/Info-App.plist
        CODE_SIGN_ENTITLEMENTS: Support/App.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        DEAD_CODE_STRIPPING: YES
  MenuShotFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/FinderSync
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cgbin.menushot.FinderSync
        PRODUCT_NAME: MenuShotFinder
        INFOPLIST_FILE: Support/Info-FinderSync.plist
        CODE_SIGN_ENTITLEMENTS: Support/FinderSync.entitlements
        ENABLE_HARDENED_RUNTIME: NO
